name: WTEF Auto Sync (Manual Only)

on:
  workflow_dispatch:
    inputs:
      do_commit:
        description: "Archive the generated output on a dedicated branch? (yes/no)"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

concurrency:
  group: wtef-auto-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  auto-sync:
    runs-on: [self-hosted, Windows, X64]
    if: github.actor != 'github-actions[bot]'
    env:
      DO_COMMIT: ${{ inputs.do_commit || 'no' }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      ARTIFACT_RETENTION_DAYS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Show runner and context
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "Actor: $env:GITHUB_ACTOR"
          Write-Host "Event: $env:GITHUB_EVENT_NAME"
          Write-Host "Commit mode: $env:DO_COMMIT"

      - name: Check Python
        shell: pwsh
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { throw "Python is required but unavailable." }

      - name: Run monitor and archival gate
        shell: pwsh
        run: |
          python monitor.py
          if ($LASTEXITCODE -ne 0) { throw "Monitor or archival gate failed." }

      - name: Upload monitor outputs for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wtef-monitor-output
          path: automation/v2/outputs/*.json
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
