# .github/workflows/auto-sync.yml
name: WTEF Auto Sync v2

on:
  push:
    paths:
      - 'automation/**'
  schedule:
    - cron: '0 2 * * *'  # daily at 02:00 UTC

permissions:
  contents: write

jobs:
  auto-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run auto commit
        env:
          WTEF_PAT: ${{ secrets.WTEF_PAT }}
        run: |
          python automation/v2/auto_commit.py

      - name: Update Cognitive Archive
        run: |
          python automation/v2/archive_linker.py
