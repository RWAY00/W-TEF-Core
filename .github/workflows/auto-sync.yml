# .github/workflows/auto-sync.yml  (Suggested - PAT enabled checkout)
name: WTEF Auto Sync v2

on:
  push:
    paths:
      - 'automation/**'
  schedule:
    - cron: '0 2 * * *'  # daily at 02:00 UTC (07:30 IST)
  workflow_dispatch:

permissions:
  contents: write
  workflows: write   # add if you need to trigger other workflows from this run

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WTEF_PAT }}   # use PAT to allow pushes if your scripts push

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests

      - name: Create CI monitor output (heartbeat)
        run: |
          python - <<'PY'
          import os, json, datetime
          os.makedirs("automation/v2/outputs", exist_ok=True)
          fname = "automation/v2/outputs/test_monitor_ci.json"
          data = {
            "generated_at": datetime.datetime.utcnow().isoformat()+"Z",
            "summary": "CI heartbeat - auto-sync",
            "metrics": {}
          }
          with open(fname,"w") as f:
              json.dump(data, f, indent=2)
          print("Wrote:", fname)
          PY

      - name: Run auto commit
        env:
          WTEF_PAT: ${{ secrets.WTEF_PAT }}
        run: |
          # Optional: show python version & list files for debugging
          python --version
          ls -la automation/v2 || true
          python automation/v2/auto_commit.py

      - name: Update Cognitive Archive
        run: |
          python automation/v2/archive_linker.py
