# .github/workflows/auto-sync.yml  (Self-hosted runner)
name: WTEF Auto Sync v2

on:
  push:
    paths:
      - 'automation/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-sync:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install requests

      - name: Create CI monitor output (heartbeat)
        run: |
          python - <<'PY'
          import os, json, datetime
          os.makedirs("automation/v2/outputs", exist_ok=True)
          fname = "automation/v2/outputs/test_monitor_ci.json"
          data = {
              "generated_at": datetime.datetime.utcnow().isoformat()+"Z",
              "summary": "CI heartbeat - auto-sync",
              "metrics": {}
          }
          with open(fname,"w") as f:
              json.dump(data, f, indent=2)
          print("Wrote:", fname)
          PY

      - name: Run auto commit
        run: |
          python --version
          ls -la automation/v2 || true
          python automation/v2/auto_commit.py

      - name: Update Cognitive Archive
        run: |
          python automation/v2/archive_linker.py
