name: WTEF Daily Stability Monitor

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC (08:30 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stability-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn
            - name: Run stability verification
        shell: bash
        run: |
          echo "Running stability verification (monitor.py)..."
          # ensure python is available (we set up python earlier in the workflow)
          if command -v python >/dev/null 2>&1; then
            python monitor.py
          else
            echo "Python not found"
            exit 1
          fi

      - name: Write monitor version file
        run: |
          echo "monitor_version=$(date -u +%Y%m%dT%H%M%SZ)" > WTEF_MONITOR_VERSION.txt
          cat WTEF_MONITOR_VERSION.txt

      - name: Commit updated log and version
        run: |
          git config user.name "RWAY-AutoMonitor"
          git config user.email "allappmi@gmail.com"
          git add WTEF_Daily_Log.json WTEF_MONITOR_VERSION.txt || true
          git commit -m "Auto update: Daily Stability Log $(date -u +%Y%m%dT%H%M%SZ)" || echo "No changes to commit"
          git push origin HEAD:main
