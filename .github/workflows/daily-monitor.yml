---
name: WTEF Daily Stability Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # Runs daily at 03:00 UTC (08:30 IST)

permissions:
  contents: write

jobs:
  stability-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run WTEF Monitor
        run: |
          python monitor.py

      - name: Commit updated log
        run: |
          git config user.name "RWAY-AutoMonitor"
          git config user.email "RWAY00+auto@users.noreply.github.com"
          git add WTEF_Daily_Log.json || true
          git commit -m "Auto update: Daily Stability Log" || echo "No changes to commit"
          git push origin HEAD:main || echo "No push (likely missing permission token)"
