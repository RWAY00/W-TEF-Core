name: WTEF Daily Stability Monitor

# Allow manual & scheduled runs
on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC (08:30 IST)
  workflow_dispatch:

# Important: allow write so workflow can push changes
permissions:
  contents: write

jobs:
  stability-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # << important for writing back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run stability verification
        run: |
          # if you already have a monitor script, run it
          # otherwise create a quick sample log file for test
          if [ -f WTEF_Persistent_Cognitive_Archive.csv ]; then
            python -c "print('archive exists: ok')"
            # Replace the following line with your real script e.g. python monitor_run.py
            python - <<'PY'
import datetime, json
row = {"timestamp_utc": datetime.datetime.utcnow().isoformat(), "test":"ok"}
open('WTEF_Daily_Log.json','w').write(json.dumps(row))
print('Created WTEF_Daily_Log.json')
PY
          else
            echo "Archive missing; creating test log file"
            python - <<'PY'
import datetime, json
row = {"timestamp_utc": datetime.datetime.utcnow().isoformat(), "note":"archive-missing-test"}
open('WTEF_Daily_Log.json','w').write(json.dumps(row))
print('Created WTEF_Daily_Log.json (test)')
PY
          fi

      - name: Commit updated log
        run: |
          git config user.name "RWAY-AutoMonitor"
          git config user.email "auto@wtef.local"
          git add WTEF_Daily_Log.json || true
          git commit -m "Auto update: Daily Stability Log" || echo "No changes to commit"
          git push origin HEAD:main
