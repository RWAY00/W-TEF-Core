name: WTEF Daily Stability Monitor

# allow manual runs + scheduled daily run
on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC (08:30 IST)
  workflow_dispatch:

# allow write so workflow can push changes back
permissions:
  contents: write

jobs:
  stability-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # allow pushes using GITHUB_TOKEN

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q pandas numpy scikit-learn

      - name: Run stability verification (create small python script and run)
        shell: bash
        run: |
          echo "Running stability verification (monitor.py)..."

          # if you already have the archive CSV in repo, we will create a log using monitor.py
          if [ -f WTEF_Persistent_Cognitive_Archive.csv ]; then
            echo "Archive found — creating monitor.py and running it"
            cat > monitor.py <<'PY'
import datetime, json, os
# quick sample monitor that writes one JSON line with timestamp
row = {"timestamp_utc": datetime.datetime.utcnow().isoformat(), "test": "ok"}
with open('WTEF_Daily_Log.json', 'w') as f:
    f.write(json.dumps(row))
print("Created WTEF_Daily_Log.json -", row)
PY
            python monitor.py
            rm -f monitor.py
          else
            echo "Archive missing; creating a small test log with monitor.py"
            cat > monitor.py <<'PY'
import datetime, json, os
row = {"timestamp_utc": datetime.datetime.utcnow().isoformat(), "note": "archive-missing-test"}
with open('WTEF_Daily_Log.json', 'w') as f:
    f.write(json.dumps(row))
print("Created WTEF_Daily_Log.json (test) -", row)
PY
            python monitor.py
            rm -f monitor.py
          fi

      - name: Write monitor version file
        run: |
          # write a tiny version file (timestamp) so we can track runs
          echo "monitor_version=$(date -u +%Y%m%dT%H%M%SZ)" > WTEF_MONITOR_VERSION.txt
          cat WTEF_MONITOR_VERSION.txt

      - name: Commit updated log and version (push back to repo)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          # configure git commit identity to avoid exposing private email
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          git add WTEF_Daily_Log.json WTEF_MONITOR_VERSION.txt || true
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          git commit -m "Auto update: Daily Stability Log ${TIMESTAMP}" || echo "No changes to commit"
          # push using the preconfigured token (persist-credentials: true)
          git push origin HEAD:main || echo "Push failed (check permissions)"
