name: WTEF Daily Stability Monitor

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC (08:30 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stability-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn

      - name: Run stability verification
        shell: bash
        run: |
          echo "Running stability verification..."
          if [ -f WTEF_Persistent_Cognitive_Archive.csv ]; then
            echo "Archive found, generating log..."
            cat > monitor.py <<'PY'
import datetime, json, os
row = {"timestamp_utc": datetime.datetime.utcnow().isoformat(), "status": "ok"}
with open("WTEF_Daily_Log.json", "w") as f:
    json.dump(row, f)
print("Created WTEF_Daily_Log.json -", row)
PY
            python monitor.py
            rm -f monitor.py
          else
            echo "Archive missing, generating test log..."
            cat > monitor.py <<'PY'
import datetime, json, os
row = {"timestamp_utc": datetime.datetime.utcnow().isoformat(), "status": "archive-missing"}
with open("WTEF_Daily_Log.json", "w") as f:
    json.dump(row, f)
print("Created WTEF_Daily_Log.json (test) -", row)
PY
            python monitor.py
            rm -f monitor.py
          fi

      - name: Write version file
        run: |
          echo "monitor_version=$(date -u +%Y%m%dT%H%M%SZ)" > WTEF_MONITOR_VERSION.txt
          cat WTEF_MONITOR_VERSION.txt

      - name: Commit updated log
        run: |
          git config user.name "RWAY-AutoMonitor"
          git config user.email "RWAY00@users.noreply.github.com"
          git add WTEF_Daily_Log.json WTEF_MONITOR_VERSION.txt || true
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          git commit -m "Auto update: Daily Stability Log ${TIMESTAMP}" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push failed (check permissions)"
